name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  root:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          rebar3-version: '3.23'
      - run: escript scripts/check_dependency_lock.escript rebar.lock
      - run: rebar3 compile
      - name: Check public API rules
        run: |
          escript scripts/xref_unused_exports.escript "$RUNNER_TEMP/api_inventory.md"
          escript scripts/check_api_rules.escript "$RUNNER_TEMP/api_inventory.md"
      - run: rebar3 xref
      - run: rebar3 dialyzer
      - run: rebar3 eunit
      - run: rebar3 ct

  examples:
    runs-on: ubuntu-latest
    needs: root
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          rebar3-version: '3.23'
      - name: Verify examples build and tests
        run: ./scripts/check_examples.sh
